name: Compact Siberia values
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('siberia.html')
          s=p.read_text(encoding='utf-8')
          css='''\n/* compact values block */\n.values-section{padding:52px 60px 64px!important}\n.values-grid{width:calc(100vw - 120px)!important;max-width:none!important;margin:34px 0 0 50%!important;transform:translateX(-50%)!important}\n.value-block{height:176px!important;min-height:0!important;padding:28px 36px!important;overflow:hidden!important}\n.value-icon{font-size:20px!important;margin-bottom:18px!important;line-height:1!important}\n.value-title{font-size:30px!important;line-height:1!important;margin-bottom:12px!important}\n.value-text{font-size:13px!important;line-height:1.45!important;max-width:260px!important}\n@media(max-width:1024px){.values-grid{width:auto!important;margin:34px 0 0!important;transform:none!important}.value-block{height:auto!important;min-height:176px!important}}\n'''
          if '/* compact values block */' not in s:
              s=s.replace('</style>',css+'\n</style>')
          wf=Path('.github/workflows/compact-siberia-values.yml')
          if wf.exists(): wf.unlink()
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          git config user.name VodenBik
          git config user.email actions@github.com
          git add siberia.html .github/workflows/compact-siberia-values.yml
          git commit -m "compact siberia values block" || exit 0
          git push
