name: Fix Agrotek page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-agrotek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply script
        run: python scripts/patch_agrotek_page.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agrotek.html
          git diff --cached --quiet || git commit -m "Patch Agrotek page"
          git push
