name: Link mobile CSS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert mobile css link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="mobile-tune.css">'
          if link not in text:
              text = text.replace('</head>', link + '\n</head>')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Link mobile-only CSS"
          git push
