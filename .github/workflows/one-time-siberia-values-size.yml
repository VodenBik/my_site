name: One-time Siberia values size patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch Siberia values block sizing only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('siberia.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '.values-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.06);max-width:1200px;margin:40px auto 0}',
              '.values-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.06);width:calc(100vw - 96px);max-width:none;margin:40px 0 0 50%;transform:translateX(-50%)}'
          )
          s = s.replace(
              '.value-block{background:var(--sib-dark);padding:28px;transition:background .2s}',
              '.value-block{background:var(--sib-dark);min-height:176px;padding:28px 36px;transition:background .2s}'
          )
          s = s.replace(
              '.value-icon{font-size:32px;margin-bottom:16px;display:block}',
              '.value-icon{font-size:24px;margin-bottom:18px;display:block;line-height:1}'
          )
          s = s.replace(
              '.value-title{font-family:\'Bebas Neue\',sans-serif;font-size:28px;color:var(--sib-sky);margin-bottom:10px;letter-spacing:.02em}',
              '.value-title{font-family:\'Bebas Neue\',sans-serif;font-size:32px;color:var(--sib-sky);margin-bottom:14px;letter-spacing:.02em;line-height:1}'
          )
          s = s.replace(
              '.value-text{font-size:13px;color:rgba(255,255,255,.4);line-height:1.65}',
              '.value-text{font-size:13px;color:rgba(255,255,255,.4);line-height:1.55;max-width:260px}'
          )
          s = s.replace(
              '  .values-grid{grid-template-columns:1fr 1fr}',
              '  .values-grid{grid-template-columns:1fr 1fr;width:auto;max-width:none;margin:40px 0 0;transform:none}'
          )
          wf = Path('.github/workflows/one-time-siberia-values-size.yml')
          if wf.exists():
              wf.unlink()
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "VodenBik"
          git config user.email "actions@github.com"
          git add siberia.html .github/workflows/one-time-siberia-values-size.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "adjust siberia values block sizing"
            git push
          fi
