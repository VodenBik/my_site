name: Fix image paths

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken cover paths
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'projects/poolsun-cover.webp': 'projects/poolsun/1.webp',
              'projects/agrotek-cover.webp': 'projects/agrotek/2.webp',
          }
          for name in ['index.html', 'portfolio.html']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html portfolio.html
          git diff --cached --quiet || git commit -m "Fix project cover image paths"
          git push
