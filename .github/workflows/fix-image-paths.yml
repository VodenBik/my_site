name: Fix image paths

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken cover paths
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'projects/poolsun-cover.webp': 'projects/poolsun/1.webp',
              'projects/agrotek-cover.webp': 'projects/agrotek/2.webp',
          }

          pages = ['index.html']

          changed = []
          for name in pages:
              p = Path(name)
              if not p.exists():
                  print(f"skip missing: {name}")
                  continue

              text = p.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)

              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(name)

          if changed:
              print("updated:", ", ".join(changed))
          else:
              print("no cover path changes needed")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix project cover image paths"
          git push
