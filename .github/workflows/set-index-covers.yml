name: Set index cover paths

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index cover image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'projects/fortress-cover.webp': 'projects/covers/fortress-cover.webp',
              'projects/nabucco-cover.webp': 'projects/covers/nabucco-cover.webp',
              'projects/boyarko-cover.webp': 'projects/covers/boyarko-cover.webp',
              'projects/osteriya-cover.webp': 'projects/covers/osteriya-cover.webp',
              'projects/siberia-cover.webp': 'projects/covers/siberia-cover.webp',
              'projects/poolsun/1.webp': 'projects/covers/poolsun-cover.webp',
              'projects/agrotek/2.webp': 'projects/covers/agrotek-cover.webp',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use dedicated cover images on index"
          git push
