name: Fix duplicate mobile CSS on main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'fix-mobile-css'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove duplicate stylesheet and obsolete workflow
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')

          versioned = '<link rel="stylesheet" href="mobile-tune.css?v=nav-active">'
          duplicate = '<link rel="stylesheet" href="mobile-tune.css">'

          if text.count(versioned) != 1:
              raise RuntimeError(f'Expected one versioned link, found {text.count(versioned)}')
          if text.count(duplicate) != 1:
              raise RuntimeError(f'Expected one duplicate link, found {text.count(duplicate)}')

          index.write_text(text.replace(duplicate + '\n', '', 1), encoding='utf-8')

          workflows = root / '.github' / 'workflows'
          obsolete = workflows / 'link-mobile-css.yml'
          if not obsolete.exists():
              raise RuntimeError('Obsolete link-mobile-css workflow was not found')
          obsolete.unlink()

          (workflows / 'fix-mobile-css-main.yml').unlink()

      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'mobile-tune.css?v=nav-active' index.html)" = "1"
          test "$(grep -c 'href="mobile-tune.css"' index.html || true)" = "0"
          test ! -e .github/workflows/link-mobile-css.yml
          test ! -e .github/workflows/fix-mobile-css-main.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove duplicate mobile CSS automation"
          git push origin main
